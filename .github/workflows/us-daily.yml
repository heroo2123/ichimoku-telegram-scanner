name: US Markets Daily Ichimoku Scan

on:
  workflow_dispatch:
  schedule:
    # Scan after the completed US cash session; delivery remains 15:00 Kuwait next day.
    - cron: '17 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: ichimoku-production-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: true }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: Scan completed US candles and defer Telegram
        run: python scanner.py --market us --defer-delivery
      - name: Persist V3 signals and regime
        run: |
          python -m v3.cli ingest --market us
          python -m v3.cli regime --market us
          python -m v3.cli lifecycle
          python -m v3.cli paper
      - name: Commit scanner and V3 fallback state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Update US scanner V3 state"
          git pull --rebase origin main
          git push origin HEAD:main
