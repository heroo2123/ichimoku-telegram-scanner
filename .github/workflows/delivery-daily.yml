name: Telegram Delivery at 3 PM Kuwait

on:
  workflow_dispatch:
  schedule:
    # Start off-peak, then wait until 15:00 Kuwait (12:00 UTC). This avoids
    # GitHub's common top-of-hour scheduler congestion without sending early.
    - cron: '45 11 * * *'
    # Quiet catch-up protects against a delayed or missed primary scheduler run.
    - cron: '20 12 * * *'

permissions:
  contents: write

concurrency:
  group: ichimoku-production-state
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: true }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: Hold early scheduler until 3 PM Kuwait
        if: github.event.schedule == '45 11 * * *'
        run: python -m v3.scheduling --hour 12 --minute 0
      - name: Deliver queued signals
        shell: bash
        run: |
          extra=()
          if [[ "${{ github.event.schedule }}" == "20 12 * * *" ]]; then
            extra+=(--quiet-when-empty)
          fi
          python scanner.py --market all --deliver-pending "${extra[@]}"
      - name: Refresh V3 state after delivery
        run: |
          python -m v3.cli paper
      - name: Commit delivery state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Update Telegram delivery state"
          git pull --rebase origin main
          git push origin HEAD:main
