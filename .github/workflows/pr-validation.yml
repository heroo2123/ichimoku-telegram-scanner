name: Ichimoku 2.0 Branch Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ichimoku-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q scanner.py config.py

      - name: Export decoded scanner implementation
        run: |
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          root = Path('.')
          payload = ''.join(
              (root / 'scanner_payload' / f'part{i}.txt').read_text(encoding='utf-8').strip()
              for i in range(5)
          )
          source = zlib.decompress(base64.b85decode(payload.encode('ascii'))).decode('utf-8')
          Path('scanner_impl.py').write_text(source, encoding='utf-8')
          print(f'Exported scanner_impl.py ({len(source)} characters)')
          PY

      - name: Upload decoded scanner source
        uses: actions/upload-artifact@v4
        with:
          name: scanner-implementation-source
          path: scanner_impl.py
          retention-days: 3

      - name: Validate scanner API and configuration
        run: |
          python - <<'PY'
          import config
          import scanner

          assert callable(getattr(scanner, "main", None)), "scanner.main is missing"
          assert config.CONVERSION_LENGTH == 20
          assert config.BASE_LENGTH == 60
          assert config.SPAN_B_LENGTH == 120
          assert config.DISPLACEMENT == 30
          assert "USDT" in config.CRYPTO_STABLE_ASSETS
          assert "TRY" in config.CRYPTO_FIAT_ASSETS
          assert config.MIN_SCORE_TO_REPORT <= config.MIN_SCORE_FOR_DETAIL
          assert config.TELEGRAM_MAX_RETRIES >= 3
          assert config.PERFORMANCE_HORIZONS == [1, 3, 5, 10, 20]
          print("Scanner API and configuration checks passed")
          PY

      - name: Run limited crypto dry scan
        run: |
          python - <<'PY'
          import sys
          import config
          import scanner

          config.MAX_SYMBOLS_PER_MARKET = 8
          config.SEND_CHART_IMAGES = False
          config.SEND_CSV_REPORT = False
          config.SEND_COMPLETION_SUMMARY = False
          config.SEND_RUN_SUMMARY_WHEN_NO_SIGNALS = False
          config.BINANCE_SYMBOL_PAUSE_SECONDS = 0
          sys.argv = ["scanner.py", "--market", "crypto", "--dry-run"]
          raise SystemExit(scanner.main())
          PY

      - name: Run limited US dry scan and capture diagnostics
        id: us_scan
        shell: bash
        run: |
          set +e
          python - <<'PY' > us-scan.log 2>&1
          import sys
          import config
          import scanner

          config.MAX_SYMBOLS_PER_MARKET = 8
          config.SEND_CHART_IMAGES = False
          config.SEND_CSV_REPORT = False
          config.SEND_COMPLETION_SUMMARY = False
          config.SEND_RUN_SUMMARY_WHEN_NO_SIGNALS = False
          config.YFINANCE_BATCH_SIZE = 4
          config.YFINANCE_BATCH_RETRIES = 1
          config.YFINANCE_BATCH_PAUSE_SECONDS = 0
          sys.argv = ["scanner.py", "--market", "us", "--dry-run"]
          raise SystemExit(scanner.main())
          PY
          status=$?
          echo "$status" > us-scan-status.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 120 us-scan.log
          exit 0

      - name: Upload US scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-scan-diagnostics
          path: |
            us-scan.log
            us-scan-status.txt
          retention-days: 3

      - name: Send Telegram validation message
        run: python scanner.py --test-telegram

      - name: Fail if US dry scan failed
        if: steps.us_scan.outputs.exit_code != '0'
        run: |
          echo "US dry scan failed with exit code ${{ steps.us_scan.outputs.exit_code }}"
          exit 1
