name: Weekly V3 Research

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 0'

permissions:
  contents: write

concurrency:
  group: ichimoku-production-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: Benchmark backtests
        run: |
          python -m v3.cli backtest --market crypto --symbols BTCUSDT ETHUSDT BNBUSDT
          python -m v3.cli backtest --market us --symbols SPY QQQ IWM
          python -m v3.cli calibrate --horizon 10
          python -m v3.cli maintenance
      - name: Commit local fallback research data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v3_*.json
          git diff --cached --quiet || git commit -m "Update V3 research data"
          git pull --rebase origin main
          git push origin HEAD:main
